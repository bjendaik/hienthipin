<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BMS Monitor - Web Bluetooth</title>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --primary: #3b82f6;
      --danger: #ef4444;
      --success: #22c55e;
      --border: #334155;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 480px;
      background: var(--card-bg);
      border-radius: 16px;
      padding: 24px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.4);
      border: 1px solid var(--border);
    }

    h1 {
      font-size: 1.4rem;
      text-align: center;
      margin-bottom: 8px;
    }

    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 0.85rem;
      padding: 4px 10px;
      border-radius: 9999px;
      background: #334155;
      color: var(--text-muted);
      margin: 0 auto 20px;
      display: table;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--text-muted);
    }

    .status-dot.connected {
      background: var(--success);
      box-shadow: 0 0 8px var(--success);
    }

    .button-group {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-bottom: 24px;
    }

    button {
      padding: 12px;
      border-radius: 8px;
      border: none;
      font-weight: 600;
      font-size: 0.95rem;
      cursor: pointer;
      transition: all 0.2s;
    }

    button:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    .btn-connect {
      background: var(--primary);
      color: white;
    }
    .btn-connect:hover:not(:disabled) {
      background: #2563eb;
    }

    .btn-disconnect {
      background: var(--danger);
      color: white;
    }
    .btn-disconnect:hover:not(:disabled) {
      background: #dc2626;
    }

    .grid-metrics {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-bottom: 12px;
    }

    .card {
      background: #0f172a;
      padding: 16px;
      border-radius: 12px;
      border: 1px solid var(--border);
      text-align: center;
    }

    .card-full {
      grid-column: span 2;
    }

    .label {
      font-size: 0.85rem;
      color: var(--text-muted);
      margin-bottom: 6px;
    }

    .value {
      font-size: 1.8rem;
      font-weight: 700;
    }

    .unit {
      font-size: 1rem;
      font-weight: 400;
      color: var(--text-muted);
      margin-left: 2px;
    }

    .progress-bar-bg {
      width: 100%;
      height: 10px;
      background: #334155;
      border-radius: 5px;
      margin-top: 10px;
      overflow: hidden;
    }

    .progress-bar-fill {
      height: 100%;
      width: 0%;
      background: var(--success);
      transition: width 0.3s ease;
    }

    .raw-log {
      margin-top: 16px;
      font-family: monospace;
      font-size: 0.75rem;
      color: var(--text-muted);
      text-align: center;
      word-break: break-all;
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>BMS Dashboard</h1>
    
    <div class="status-badge">
      <div id="statusDot" class="status-dot"></div>
      <span id="statusText">Chưa kết nối</span>
    </div>

    <div class="button-group">
      <button id="btnConnect" class="btn-connect" onclick="connectBLE()">Kết nối BLE</button>
      <button id="btnDisconnect" class="btn-disconnect" onclick="disconnectBLE()" disabled>Ngắt kết nối</button>
    </div>

    <div class="grid-metrics">
      <div class="card">
        <div class="label">Điện áp</div>
        <div class="value"><span id="valV">--</span><span class="unit">V</span></div>
      </div>

      <div class="card">
        <div class="label">Dòng điện</div>
        <div class="value"><span id="valI">--</span><span class="unit">A</span></div>
      </div>

      <div class="card card-full">
        <div class="label">Dung lượng pin (SOC)</div>
        <div class="value"><span id="valSoc">--</span><span class="unit">%</span></div>
        <div class="progress-bar-bg">
          <div id="socBar" class="progress-bar-fill"></div>
        </div>
      </div>
    </div>

    <div id="rawLog" class="raw-log">Payload: --</div>
  </div>

  <script>
    // UUID trùng khớp với code trên ESP32
    const SERVICE_UUID        = "4fafc201-1fb5-459e-8fcc-c5c9c331914b";
    const CHARACTERISTIC_UUID = "beb5483e-36e1-4688-b7f5-ea07361b26a8";

    let bleDevice = null;
    let bmsCharacteristic = null;

    const btnConnect = document.getElementById('btnConnect');
    const btnDisconnect = document.getElementById('btnDisconnect');
    const statusText = document.getElementById('statusText');
    const statusDot = document.getElementById('statusDot');
    const valV = document.getElementById('valV');
    const valI = document.getElementById('valI');
    const valSoc = document.getElementById('valSoc');
    const socBar = document.getElementById('socBar');
    const rawLog = document.getElementById('rawLog');

    async function connectBLE() {
      try {
        statusText.textContent = "Đang tìm kiếm thiết bị...";

        // Yêu cầu quyền truy cập thiết bị có Service UUID tương ứng
        bleDevice = await navigator.bluetooth.requestDevice({
          filters: [{ namePrefix: "ESP32_BMS" }],
          optionalServices: [SERVICE_UUID]
        });

        // Lắng nghe sự kiện ngắt kết nối (do ESP32 hoặc mất sóng)
        bleDevice.addEventListener('gattserverdisconnected', onDisconnected);

        statusText.textContent = "Đang kết nối GATT...";
        const server = await bleDevice.gatt.connect();

        const service = await server.getPrimaryService(SERVICE_UUID);
        bmsCharacteristic = await service.getCharacteristic(CHARACTERISTIC_UUID);

        // Đăng ký nhận Notify
        await bmsCharacteristic.startNotifications();
        bmsCharacteristic.addEventListener('characteristicvaluechanged', handleNotify);

        // Cập nhật trạng thái UI
        statusText.textContent = "Đã kết nối: " + bleDevice.name;
        statusDot.classList.add('connected');
        btnConnect.disabled = true;
        btnDisconnect.disabled = false;

      } catch (error) {
        console.error("Lỗi BLE:", error);
        statusText.textContent = "Kết nối thất bại";
        resetUI();
      }
    }

    // Xử lý dữ liệu nhận được từ Notify
    function handleNotify(event) {
      const decoder = new TextDecoder('utf-8');
      const jsonString = decoder.decode(event.target.value);
      rawLog.textContent = "Payload: " + jsonString;

      try {
        const data = JSON.parse(jsonString);
        
        if (data.v !== undefined) valV.textContent = data.v.toFixed(1);
        if (data.i !== undefined) valI.textContent = data.i.toFixed(1);
        if (data.soc !== undefined) {
          valSoc.textContent = data.soc;
          socBar.style.width = Math.min(Math.max(data.soc, 0), 100) + "%";
        }
      } catch (e) {
        console.warn("Dữ liệu không phải định dạng JSON hợp lệ:", jsonString);
      }
    }

    // Nút ngắt kết nối trên web
    function disconnectBLE() {
      if (!bleDevice || !bleDevice.gatt.connected) return;
      bleDevice.gatt.disconnect();
    }

    // Callback khi ngắt kết nối
    function onDisconnected() {
      statusText.textContent = "Đã ngắt kết nối";
      resetUI();
    }

    function resetUI() {
      statusDot.classList.remove('connected');
      btnConnect.disabled = false;
      btnDisconnect.disabled = true;
      valV.textContent = "--";
      valI.textContent = "--";
      valSoc.textContent = "--";
      socBar.style.width = "0%";
      rawLog.textContent = "Payload: --";
    }
  </script>
</body>
</html>
