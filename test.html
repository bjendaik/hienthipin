<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ESP32 Flasher - Nạp Code Qua Web</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Segoe UI', Tahoma, sans-serif;
    background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 20px;
    color: #333;
  }
  .container {
    background: #fff;
    border-radius: 16px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.3);
    max-width: 650px;
    width: 100%;
    padding: 35px;
  }
  h1 {
    color: #1e3c72;
    font-size: 26px;
    margin-bottom: 8px;
    text-align: center;
  }
  .subtitle {
    text-align: center;
    color: #777;
    font-size: 14px;
    margin-bottom: 25px;
  }
  .warning {
    background: #fff3cd;
    border-left: 4px solid #ffc107;
    padding: 12px 15px;
    border-radius: 6px;
    font-size: 13px;
    margin-bottom: 20px;
    color: #856404;
  }
  .info {
    background: #e7f3ff;
    border-left: 4px solid #2196f3;
    padding: 12px 15px;
    border-radius: 6px;
    font-size: 13px;
    margin-bottom: 20px;
    color: #0c5460;
  }
  .section {
    margin-bottom: 20px;
  }
  label {
    display: block;
    font-weight: 600;
    margin-bottom: 8px;
    color: #1e3c72;
    font-size: 14px;
  }
  .btn {
    background: linear-gradient(135deg, #1e3c72, #2a5298);
    color: white;
    border: none;
    padding: 12px 24px;
    border-radius: 8px;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s;
    width: 100%;
    margin-bottom: 10px;
  }
  .btn:hover:not(:disabled) { transform: translateY(-2px); box-shadow: 0 6px 16px rgba(30,60,114,0.4); }
  .btn:disabled { opacity: 0.5; cursor: not-allowed; }
  .btn.danger { background: linear-gradient(135deg, #c62828, #e53935); }
  .btn.success { background: linear-gradient(135deg, #2e7d32, #43a047); }
  .btn.secondary { background: #607d8b; }
  
  input[type="file"] {
    width: 100%;
    padding: 10px;
    border: 2px dashed #b0bec5;
    border-radius: 8px;
    background: #fafafa;
    cursor: pointer;
    font-size: 14px;
  }
  input[type="file"]:hover { border-color: #1e3c72; background: #f0f4f8; }
  
  select {
    width: 100%;
    padding: 10px;
    border: 1px solid #b0bec5;
    border-radius: 8px;
    font-size: 14px;
    background: white;
  }
  
  .progress-container {
    background: #e0e0e0;
    border-radius: 30px;
    height: 24px;
    overflow: hidden;
    margin: 15px 0;
    display: none;
  }
  .progress-bar {
    height: 100%;
    background: linear-gradient(90deg, #43a047, #66bb6a);
    width: 0%;
    transition: width 0.3s;
    display: flex;
    align-items: center;
    justify-content: center;
    color: white;
    font-size: 12px;
    font-weight: 600;
  }
  
  .log {
    background: #1a1a1a;
    color: #0f0;
    font-family: 'Consolas', 'Courier New', monospace;
    font-size: 12px;
    padding: 15px;
    border-radius: 8px;
    height: 180px;
    overflow-y: auto;
    margin-top: 15px;
    white-space: pre-wrap;
    word-break: break-all;
  }
  .log .err { color: #ff5252; }
  .log .warn { color: #ffc107; }
  .log .ok { color: #00e676; }
  
  .status-badge {
    display: inline-block;
    padding: 4px 12px;
    border-radius: 20px;
    font-size: 12px;
    font-weight: 600;
    margin-left: 8px;
  }
  .status-badge.connected { background: #c8e6c9; color: #2e7d32; }
  .status-badge.disconnected { background: #ffcdd2; color: #c62828; }
</style>
</head>
<body>
<div class="container">
  <h1>⚡ ESP32 Web Flasher</h1>
  <p class="subtitle">Nạp firmware trực tiếp qua trình duyệt</p>

  <div class="warning">
    ⚠️ <b>Yêu cầu:</b> Chrome/Edge (desktop) • Cáp USB Data • Driver CH340/CP210x đã cài
  </div>

  <div class="info">
    💡 <b>Cách dùng:</b> Kết nối ESP32 → Nhấn "Kết nối Serial" → Chọn file .bin → Nhấn "Nạp Firmware"
  </div>

  <div class="section">
    <label>Kết nối cổng Serial <span id="status" class="status-badge disconnected">Chưa kết nối</span></label>
    <button id="btnConnect" class="btn">🔌 Kết nối Serial</button>
    <button id="btnDisconnect" class="btn danger" disabled>❌ Ngắt kết nối</button>
  </div>

  <div class="section">
    <label>Địa chỉ Flash Offset</label>
    <select id="offset">
      <option value="0x0000">0x0000 (Bootloader)</option>
      <option value="0x1000">0x1000 (Bootloader/Partition)</option>
      <option value="0x8000">0x8000 (Partition Table)</option>
      <option value="0x10000" selected>0x10000 (Ứng dụng - Mặc định)</option>
      <option value="0xE000">0xE000 (OTA Data)</option>
      <option value="0x210000">0x210000 (SPIFFS/LittleFS)</option>
    </select>
  </div>

  <div class="section">
    <label>Chọn file Firmware (.bin)</label>
    <input type="file" id="fileInput" accept=".bin">
  </div>

  <div class="progress-container" id="progressContainer">
    <div class="progress-bar" id="progressBar">0%</div>
  </div>

  <button id="btnFlash" class="btn success" disabled>🚀 Nạp Firmware</button>

  <div class="log" id="log">[Hệ thống] Sẵn sàng. Vui lòng kết nối ESP32...</div>
</div>

<script>
// ===== Cấu hình giao thức ESP32 =====
const ESP32 = {
  SYNC: 0xC0,         // SLIP END
  ESC: 0xDB,          // SLIP ESC
  ESC_END: 0xDC,
  ESC_ESC: 0xDD,
  FLASH_BEGIN: 0x02,
  FLASH_DATA: 0x03,
  FLASH_END: 0x04,
  SYNC_CMD: 0x08,
  SPI_FLASH_END: 0x04,
  FLASH_SIZE: 0x1000, // 4KB block
  BAUD: 460800,       // Tốc độ cao sau sync
  TIMEOUT: 3000,
};

// ===== Trạng thái =====
let port = null;
let reader = null;
let writer = null;
let isConnected = false;
let isFlashing = false;

// ===== DOM =====
const $ = id => document.getElementById(id);
const btnConnect = $('btnConnect');
const btnDisconnect = $('btnDisconnect');
const btnFlash = $('btnFlash');
const fileInput = $('fileInput');
const offsetSelect = $('offset');
const logEl = $('log');
const statusEl = $('status');
const progressContainer = $('progressContainer');
const progressBar = $('progressBar');

// ===== Logger =====
function log(msg, type = '') {
  const line = document.createElement('div');
  if (type) line.className = type;
  const time = new Date().toLocaleTimeString();
  line.textContent = `[${time}] ${msg}`;
  logEl.appendChild(line);
  logEl.scrollTop = logEl.scrollHeight;
  console.log(`[${type}] ${msg}`);
}

function setStatus(text, connected) {
  statusEl.textContent = text;
  statusEl.className = 'status-badge ' + (connected ? 'connected' : 'disconnected');
}

function setProgress(pct) {
  progressContainer.style.display = 'block';
  progressBar.style.width = pct + '%';
  progressBar.textContent = pct + '%';
}

// ===== Kiểm tra hỗ trợ =====
if (!('serial' in navigator)) {
  log('Trình duyệt không hỗ trợ Web Serial API. Dùng Chrome/Edge!', 'err');
  btnConnect.disabled = true;
}

// ===== Kết nối =====
btnConnect.addEventListener('click', async () => {
  try {
    log('Đang mở hộp thoại chọn cổng...');
    port = await navigator.serial.requestPort();
    await port.open({ baudRate: 115200 });
    
    writer = port.writable.getWriter();
    reader = port.readable.getReader();
    
    isConnected = true;
    setStatus('Đã kết nối', true);
    btnConnect.disabled = true;
    btnDisconnect.disabled = false;
    btnFlash.disabled = !fileInput.files.length;
    log('✅ Kết nối thành công @ 115200 baud', 'ok');
    
    // Lắng nghe dữ liệu đến (debug)
    readLoop();
  } catch (err) {
    log('Lỗi kết nối: ' + err.message, 'err');
  }
});

btnDisconnect.addEventListener('click', async () => {
  await disconnect();
});

async function disconnect() {
  try {
    if (reader) { try { await reader.cancel(); } catch(e){} reader = null; }
    if (writer) { try { writer.releaseLock(); } catch(e){} writer = null; }
    if (port) { try { await port.close(); } catch(e){} port = null; }
    isConnected = false;
    setStatus('Chưa kết nối', false);
    btnConnect.disabled = false;
    btnDisconnect.disabled = true;
    btnFlash.disabled = true;
    log('Đã ngắt kết nối.');
  } catch (err) {
    log('Lỗi ngắt: ' + err.message, 'err');
  }
}

// Đọc log từ ESP32
async function readLoop() {
  try {
    while (isConnected && reader) {
      const { value, done } = await reader.read();
      if (done) break;
      if (value) {
        const text = new TextDecoder().decode(value);
        if (text.trim()) log('↩ ' + text.trim());
      }
    }
  } catch (err) {
    if (isConnected) log('Lỗi đọc: ' + err.message, 'err');
  }
}

fileInput.addEventListener('change', () => {
  btnFlash.disabled = !fileInput.files.length || !isConnected;
  if (fileInput.files.length) {
    log(`📁 Đã chọn: ${fileInput.files[0].name} (${(fileInput.files[0].size/1024).toFixed(1)} KB)`);
  }
});

// ===== Giao thức SLIP =====
function slipEncode(data) {
  const out = [];
  for (const byte of data) {
    if (byte === ESP32.SYNC) { out.push(ESP32.ESC, ESP32.ESC_END); }
    else if (byte === ESP32.ESC) { out.push(ESP32.ESC, ESP32.ESC_ESC); }
    else out.push(byte);
  }
  return new Uint8Array([ESP32.SYNC, ...out, ESP32.SYNC]);
}

function slipDecode(data) {
  const out = [];
  let i = 0;
  while (i < data.length) {
    const b = data[i++];
    if (b === ESP32.ESC) {
      const next = data[i++];
      if (next === ESP32.ESC_END) out.push(ESP32.SYNC);
      else if (next === ESP32.ESC_ESC) out.push(ESP32.ESC);
    } else if (b !== ESP32.SYNC) {
      out.push(b);
    }
  }
  return new Uint8Array(out);
}

// ===== Gói tin =====
function buildCommand(cmd, data, checksum = 0) {
  const size = data.length;
  const packet = new Uint8Array(8 + size);
  packet[0] = 0x00; // direction
  packet[1] = cmd;
  packet[2] = size & 0xFF;
  packet[3] = (size >> 8) & 0xFF;
  packet[4] = checksum & 0xFF;
  packet[5] = (checksum >> 8) & 0xFF;
  packet[6] = (checksum >> 16) & 0xFF;
  packet[7] = (checksum >> 24) & 0xFF;
  packet.set(data, 8);
  return packet;
}

function checksum(data) {
  let sum = 0xEF;
  for (const b of data) sum ^= b;
  return sum;
}

function u32le(v) {
  return new Uint8Array([v & 0xFF, (v>>8)&0xFF, (v>>16)&0xFF, (v>>24)&0xFF]);
}

// ===== Gửi lệnh & đợi phản hồi =====
async function sendCommand(cmd, data, timeout = ESP32.TIMEOUT) {
  const sum = checksum(data);
  const packet = buildCommand(cmd, data, sum);
  const slip = slipEncode(packet);
  
  await writer.write(slip);
  
  // Đọc phản hồi
  const response = await readResponse(timeout);
  if (!response || response.length < 8) {
    throw new Error('Không nhận được phản hồi hợp lệ');
  }
  const respCmd = response[1];
  if (respCmd !== cmd) {
    throw new Error(`Lệnh không khớp: gửi 0x${cmd.toString(16)}, nhận 0x${respCmd.toString(16)}`);
  }
  const status = response[4] | (response[5]<<8) | (response[6]<<16) | (response[7]<<24);
  const statusStr = ['OK','FAIL','INVALID_CMD','INVALID_STATE','INVALID_LEN'][status] || status;
  if (status !== 0) throw new Error(`ESP32 báo lỗi: ${statusStr}`);
  return response.slice(8);
}

// Đọc dữ liệu với timeout
let buffer = [];
function readResponse(timeout) {
  return new Promise((resolve, reject) => {
    const timer = setTimeout(() => {
      reject(new Error('Timeout chờ phản hồi'));
    }, timeout);
    
    const check = async () => {
      try {
        const { value, done } = await reader.read();
        if (done) { clearTimeout(timer); resolve(null); return; }
        if (value) {
          buffer.push(...value);
          // Tìm frame SLIP
          const startIdx = buffer.indexOf(ESP32.SYNC);
          const endIdx = buffer.indexOf(ESP32.SYNC, startIdx + 1);
          if (startIdx !== -1 && endIdx !== -1) {
            const frame = buffer.slice(startIdx + 1, endIdx);
            buffer = buffer.slice(endIdx + 1);
            clearTimeout(timer);
            resolve(slipDecode(new Uint8Array([ESP32.SYNC, ...frame, ESP32.SYNC])));
            return;
          }
        }
        check();
      } catch (err) {
        clearTimeout(timer);
        reject(err);
      }
    };
    check();
  });
}

// ===== Nạp Firmware =====
btnFlash.addEventListener('click', async () => {
  if (!isConnected || isFlashing) return;
  
  const file = fileInput.files[0];
  if (!file) return;
  
  isFlashing = true;
  btnFlash.disabled = true;
  btnConnect.disabled = true;
  btnDisconnect.disabled = true;
  
  try {
    log('🚀 Bắt đầu nạp firmware...', 'warn');
    const arrayBuffer = await file.arrayBuffer();
    const firmware = new Uint8Array(arrayBuffer);
    const offset = parseInt(offsetSelect.value, 16);
    
    log(`📦 Kích thước: ${firmware.length} bytes | Offset: 0x${offset.toString(16)}`);
    
    // Đợi ESP32 sẵn sàng
    await sleep(200);
    
    // === Bước 1: SYNC ===
    log('🔄 Đồng bộ với ESP32...');
    const syncData = new Uint8Array([
      0x07, 0x07, 0x12, 0x20,
      ...new Array(32).fill(0x55)
    ]);
    await sendCommand(ESP32.SYNC_CMD, syncData);
    log('✅ Đồng bộ thành công!', 'ok');
    
    // === Bước 2: FLASH_BEGIN ===
    const numBlocks = Math.ceil(firmware.length / ESP32.FLASH_SIZE);
    const flashBeginData = new Uint8Array([
      ...u32le(firmware.length),
      ...u32le(numBlocks),
      ...u32le(ESP32.FLASH_SIZE),
      ...u32le(offset),
    ]);
    log(`📝 Gửi lệnh FLASH_BEGIN (${numBlocks} blocks)...`);
    await sendCommand(ESP32.FLASH_BEGIN, flashBeginData);
    log('✅ FLASH_BEGIN OK', 'ok');
    
    // === Bước 3: FLASH_DATA ===
    log('📤 Đang ghi dữ liệu...');
    setProgress(0);
    const sequence = new Uint8Array(4);
    for (let i = 0; i < numBlocks; i++) {
      const blockStart = i * ESP32.FLASH_SIZE;
      const blockEnd = Math.min(blockStart + ESP32.FLASH_SIZE, firmware.length);
      const chunk = firmware.slice(blockStart, blockEnd);
      
      // Padding nếu block cuối không đủ
      const paddedChunk = new Uint8Array(ESP32.FLASH_SIZE);
      paddedChunk.set(chunk);
      
      // Sequence number
      sequence[0] = i & 0xFF;
      sequence[1] = (i>>8)&0xFF;
      sequence[2] = (i>>16)&0xFF;
      sequence[3] = (i>>24)&0xFF;
      
      const flashData = new Uint8Array(4 + ESP32.FLASH_SIZE);
      flashData.set(sequence, 0);
      flashData.set(paddedChunk, 4);
      
      await sendCommand(ESP32.FLASH_DATA, flashData, 5000);
      
      const pct = Math.round(((i + 1) / numBlocks) * 100);
      if (pct % 5 === 0 || i === numBlocks - 1) {
        setProgress(pct);
        log(`  Block ${i+1}/${numBlocks} (${pct}%)`, 'ok');
      }
    }
    
    // === Bước 4: FLASH_END ===
    log('🏁 Kết thúc nạp...');
    const flashEndData = new Uint8Array([0x01, 0x00, 0x00, 0x00]); // reboot
    await sendCommand(ESP32.FLASH_END, flashEndData);
    
    setProgress(100);
    log('🎉 NẠP FIRMWARE THÀNH CÔNG!', 'ok');
    log('💡 ESP32 sẽ tự khởi động lại.', 'warn');
    
    // Đợi reboot
    await sleep(2000);
    
  } catch (err) {
    log('❌ LỖI: ' + err.message, 'err');
    setProgress(0);
    progressContainer.style.display = 'none';
    console.error(err);
  } finally {
    isFlashing = false;
    btnFlash.disabled = !fileInput.files.length;
    btnConnect.disabled = false;
    btnDisconnect.disabled = false;
  }
});

function sleep(ms) {
  return new Promise(r => setTimeout(r, ms));
}

// Cảnh báo trước khi đóng tab
window.addEventListener('beforeunload', (e) => {
  if (isFlashing) {
    e.preventDefault();
    e.returnValue = '';
  }
});
</script>
</body>
</html>
